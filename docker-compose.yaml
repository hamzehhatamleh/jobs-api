services:
  jobs:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql+psycopg://jobs_app:hamzeh12@db:5432/jobs
    depends_on:
      - db
    restart: on-failure

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=jobs_app
      - POSTGRES_PASSWORD=hamzeh12
      - POSTGRES_DB=jobs
    volumes:
      - pg-data:/var/lib/postgresql/data


volumes:
  pg-data:

